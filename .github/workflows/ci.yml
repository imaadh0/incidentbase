name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: incidentbase
          POSTGRES_USER: incidentbase
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentbase -d incidentbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_database_test
      API_TEST_DATABASE_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_api_test
      API_TEST_RUNTIME_DATABASE_URL: postgresql://incidentbase_app:ci-runtime-password-change-me@127.0.0.1:5432/incidentbase_api_test
      API_TEST_WORKER_DATABASE_URL: postgresql://incidentbase_worker_app:ci-worker-password-change-me@127.0.0.1:5432/incidentbase_api_test
      WORKER_TEST_DATABASE_URL: postgresql://incidentbase_worker_app:ci-worker-password-change-me@127.0.0.1:5432/incidentbase_database_test
      WORKER_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolation test databases
        env:
          PGPASSWORD: ci-database-password
        run: |
          createdb --host 127.0.0.1 --username incidentbase incidentbase_database_test
          createdb --host 127.0.0.1 --username incidentbase incidentbase_api_test
      - name: Apply tenancy migrations to repository test database
        env:
          DATABASE_MIGRATION_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_database_test
        run: pnpm --filter @incidentbase/database db:migrate:deploy
      - name: Apply tenancy migrations to API test database
        env:
          DATABASE_MIGRATION_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_api_test
        run: pnpm --filter @incidentbase/database db:migrate:deploy
      - name: Provision restricted API test role
        env:
          DATABASE_MIGRATION_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_api_test
          DATABASE_URL: postgresql://incidentbase_app:ci-runtime-password-change-me@127.0.0.1:5432/incidentbase_api_test
          WORKER_DATABASE_URL: postgresql://incidentbase_worker_app:ci-worker-password-change-me@127.0.0.1:5432/incidentbase_database_test
        run: pnpm --filter @incidentbase/database db:provision:runtime
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        service: [web, api, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.service }}
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start full application stack
        run: docker compose -p incidentbase-e2e -f docker-compose.yml -f docker-compose.e2e.yml up --build -d --wait
      - name: Run browser acceptance suite
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: pnpm test:e2e
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p incidentbase-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=150
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      - name: Stop application stack
        if: always()
        run: docker compose -p incidentbase-e2e -f docker-compose.yml -f docker-compose.e2e.yml down --volumes
