name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: incidentbase
          POSTGRES_USER: incidentbase
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentbase -d incidentbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_database_test
      API_TEST_DATABASE_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_api_test
      API_TEST_RUNTIME_DATABASE_URL: postgresql://incidentbase_app:ci-runtime-password-change-me@127.0.0.1:5432/incidentbase_api_test
      API_TEST_WORKER_DATABASE_URL: postgresql://incidentbase_worker_app:ci-worker-password-change-me@127.0.0.1:5432/incidentbase_api_test
      WORKER_TEST_DATABASE_URL: postgresql://incidentbase_worker_app:ci-worker-password-change-me@127.0.0.1:5432/incidentbase_database_test
      WORKER_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        env:
          PGPASSWORD: ci-database-password
        run: |
          createdb --host 127.0.0.1 --username incidentbase incidentbase_database_test
          createdb --host 127.0.0.1 --username incidentbase incidentbase_api_test
      - name: Apply repository test migrations
        env:
          DATABASE_MIGRATION_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_database_test
        run: pnpm --filter @incidentbase/database db:migrate:deploy
      - name: Apply API test migrations
        env:
          DATABASE_MIGRATION_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_api_test
        run: pnpm --filter @incidentbase/database db:migrate:deploy
      - name: Provision restricted test roles
        env:
          DATABASE_MIGRATION_URL: postgresql://incidentbase:ci-database-password@127.0.0.1:5432/incidentbase_api_test
          DATABASE_URL: postgresql://incidentbase_app:ci-runtime-password-change-me@127.0.0.1:5432/incidentbase_api_test
          WORKER_DATABASE_URL: postgresql://incidentbase_worker_app:ci-worker-password-change-me@127.0.0.1:5432/incidentbase_database_test
        run: pnpm --filter @incidentbase/database db:provision:runtime
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet

  prepare:
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - id: image
        name: Normalize GHCR image prefix
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}/incidentbase" >> "$GITHUB_OUTPUT"

  images:
    needs: [verify, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        service: [web, api, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.service }}
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.service }}:${{ github.sha }}
            ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.service }}:main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: [images, prepare]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/incidentbase
          chmod 600 ~/.ssh/known_hosts ~/.ssh/incidentbase
      - name: Deploy with Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image-prefix }}
        run: |
          ssh -i ~/.ssh/incidentbase "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_PATH' && git fetch origin main && git merge --ff-only '$GITHUB_SHA' && \
            WEB_IMAGE='$IMAGE_PREFIX-web:$GITHUB_SHA' API_IMAGE='$IMAGE_PREFIX-api:$GITHUB_SHA' \
            WORKER_IMAGE='$IMAGE_PREFIX-worker:$GITHUB_SHA' MIGRATE_IMAGE='$IMAGE_PREFIX-migrate:$GITHUB_SHA' \
            docker compose pull && \
            WEB_IMAGE='$IMAGE_PREFIX-web:$GITHUB_SHA' API_IMAGE='$IMAGE_PREFIX-api:$GITHUB_SHA' \
            WORKER_IMAGE='$IMAGE_PREFIX-worker:$GITHUB_SHA' MIGRATE_IMAGE='$IMAGE_PREFIX-migrate:$GITHUB_SHA' \
            docker compose up -d --no-build --wait --wait-timeout 180 && \
            curl --fail --silent --show-error http://127.0.0.1/api/v1/health/ready && \
            curl --fail --silent --show-error http://127.0.0.1/ >/dev/null"
