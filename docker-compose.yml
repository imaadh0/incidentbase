name: incidentbase

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        SERVICE: web
    image: ${WEB_IMAGE:-incidentbase-web:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
      args:
        SERVICE: api
    image: ${API_IMAGE:-incidentbase-api:local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:-postgresql://incidentbase_app:local-runtime-password-change-me@postgres:5432/incidentbase}
      REDIS_URL: redis://redis:6379
      METRICS_TOKEN: ${METRICS_TOKEN:-local-development-metrics-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me-now}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - backend

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    image: ${MIGRATE_IMAGE:-incidentbase-migrate:local}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-postgresql://incidentbase:local-development-password-change-me@postgres:5432/incidentbase}
      DATABASE_URL: ${DATABASE_URL:-postgresql://incidentbase_app:local-runtime-password-change-me@postgres:5432/incidentbase}
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args:
        SERVICE: worker
    image: ${WORKER_IMAGE:-incidentbase-worker:local}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - backend

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentbase}
      POSTGRES_USER: ${POSTGRES_USER:-incidentbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password-change-me}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
