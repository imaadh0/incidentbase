events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  upstream incidentbase_web { server web:3000; }
  upstream incidentbase_api { server api:4000; }
  upstream mail_capture { server mail-capture:8025; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location /__e2e_mail/ {
      proxy_pass http://mail_capture/;
    }

    location /socket.io/ {
      proxy_pass http://incidentbase_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
      proxy_pass http://incidentbase_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://incidentbase_web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
